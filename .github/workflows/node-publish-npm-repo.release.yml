name: Node Publish NPM Repo Release

on:
  push:
    tags: [ 'v*' ]
env:
  NPM_REGISTRY: https://registry.npmjs.org
  GH_NPM_REGISTRY: https://npm.pkg.github.com
  NPM_PACKAGE_SCOPE: '@neonscience'
  NODE_VERSION: 24
  VERSION: ${{ github.ref_name }}

jobs:
  node-publish-npm-repo-release:
    if: github.ref_type == 'tag' && github.repository == 'NEONScience/portal-core-components'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install packages
        run: npm ci

      - name: Build package
        run: npm run publish:build

      - name: Set package version
        run: |
          NPM_VERSION=${VERSION#v}

          cd lib
          npm version "${NPM_VERSION}" --no-git-tag-version

      # ------------------------------------------------------------------------
      # NPM Registry Publish
      # ------------------------------------------------------------------------

      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.NPM_REGISTRY }}
          scope: ${{ env.NPM_PACKAGE_SCOPE }}

      - name: Publish package to NPM Registry
        run: npm publish ./lib --tag latest --access public --provenance

      # ------------------------------------------------------------------------
      # GitHub Packages Publish
      # ------------------------------------------------------------------------

      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.GH_NPM_REGISTRY }}
          scope: ${{ env.NPM_PACKAGE_SCOPE }}

      - name: Publish package to GitHub Packages
        run: npm publish ./lib --tag latest --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
